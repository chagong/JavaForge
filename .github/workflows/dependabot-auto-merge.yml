name: Dependabot Auto-Merge (Copilot CLI)

# Runs on a daily schedule and uses the GitHub Copilot CLI to audit, remediate,
# and safely merge Dependabot pull requests across all Microsoft-managed Java
# tooling repositories in this workspace.
#
# Required repository secrets:
#   - `GH_PAT`: a Personal Access Token (classic or fine-grained) with
#     `repo` + `pull_request` write access to every target microsoft/* repo.
#     Used by the gh CLI and any GitHub API access (the default `GITHUB_TOKEN`
#     cannot reach other repositories, so a PAT is mandatory). Wired into
#     GH_TOKEN and GITHUB_TOKEN. Also provides the Copilot CLI entitlement for
#     normal runs when COPILOT_CLI_TOKEN is not configured.
#   - `COPILOT_CLI_TOKEN` (required only for dry runs): a token with a GitHub
#     Copilot entitlement and no cross-repository write scopes, used only by the
#     Copilot CLI service. Dry runs never fall back to the write-capable GH_PAT.
#   - `PERSONAL_NOTIFICATION_URL`: Azure Logic App HTTP trigger URL used to send
#     one aggregated report when at least one PR is not merged.
#   - `RECIPIENTS`: comma/semicolon-separated list of recipient email addresses
#     for the Teams notification.

on:
  schedule:
    # Avoid GitHub's documented top-of-hour scheduler congestion.
    # 10:07 Asia/Shanghai (UTC+8) every day = 02:07 UTC.
    - cron: "7 2 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Audit and report only; do not approve or merge."
        type: boolean
        default: false

# Prevent overlapping runs from racing on the same PRs.
concurrency:
  group: dependabot-auto-merge
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-repository-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.repositories.outputs.matrix }}
    steps:
      - name: Build repository matrix
        id: repositories
        run: |
          echo 'matrix={"include":[{"repository":"microsoft/vscode-java-debug","slug":"vscode-java-debug"},{"repository":"microsoft/java-debug","slug":"java-debug"},{"repository":"microsoft/vscode-java-test","slug":"vscode-java-test"},{"repository":"microsoft/vscode-gradle","slug":"vscode-gradle"},{"repository":"microsoft/build-server-for-gradle","slug":"build-server-for-gradle"},{"repository":"microsoft/vscode-java-dependency","slug":"vscode-java-dependency"},{"repository":"microsoft/vscode-maven","slug":"vscode-maven"},{"repository":"microsoft/vscode-java-pack","slug":"vscode-java-pack"},{"repository":"microsoft/vscode-spring-initializr","slug":"vscode-spring-initializr"},{"repository":"microsoft/vscode-spring-boot-dashboard","slug":"vscode-spring-boot-dashboard"}]}' >> "$GITHUB_OUTPUT"

  discover-pull-requests:
    name: Discover PRs in ${{ matrix.repository }}
    needs: build-repository-matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.build-repository-matrix.outputs.matrix) }}
    env:
      GH_TOKEN: ${{ secrets.GH_PAT }}
    steps:
      - name: Find open Dependabot PRs
        run: |
          mkdir -p discovered-prs
          gh pr list \
            --repo "${{ matrix.repository }}" \
            --state open \
            --search 'author:app/dependabot' \
            --limit 100 \
            --json number,title,url \
            | jq \
                --arg repository "${{ matrix.repository }}" \
                --arg slug "${{ matrix.slug }}" \
                '[.[] | . + {repository: $repository, slug: $slug}]' \
                > discovered-prs/prs.json

      - name: Upload repository PR list
        uses: actions/upload-artifact@v4
        with:
          name: dependabot-pr-list-${{ matrix.slug }}
          path: discovered-prs/prs.json
          retention-days: 1

  build-pull-request-matrix:
    needs: discover-pull-requests
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pull-requests.outputs.matrix }}
      count: ${{ steps.pull-requests.outputs.count }}
    steps:
      - name: Download repository PR lists
        uses: actions/download-artifact@v4
        with:
          pattern: dependabot-pr-list-*
          path: discovered-prs

      - name: Build pull request matrix
        id: pull-requests
        run: |
          pull_requests="$(jq -sc 'add' discovered-prs/*/prs.json)"
          echo "matrix=$(jq -cn --argjson pull_requests "$pull_requests" '{include: $pull_requests}')" >> "$GITHUB_OUTPUT"
          echo "count=$(jq 'length' <<< "$pull_requests")" >> "$GITHUB_OUTPUT"

  manage-dependabot:
    name: Manage ${{ matrix.repository }}#${{ matrix.number }}
    needs: build-pull-request-matrix
    if: ${{ needs.build-pull-request-matrix.outputs.count != '0' }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.build-pull-request-matrix.outputs.matrix) }}
    env:
      # GH_PAT drives the gh CLI and GitHub API/MCP access (cross-repo write).
      # A separate Copilot entitlement token is mandatory only for dry runs.
      GH_TOKEN: ${{ inputs.dry_run == true && github.token || secrets.GH_PAT }}
      GITHUB_TOKEN: ${{ inputs.dry_run == true && github.token || secrets.GH_PAT }}
      COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_CLI_TOKEN }}
      WORKFLOW_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      DRY_RUN: ${{ inputs.dry_run == true && 'true' || 'false' }}
      TARGET_REPOSITORY: ${{ matrix.repository }}
      TARGET_PR_NUMBER: ${{ matrix.number }}
      TARGET_PR_TITLE: ${{ matrix.title }}
      TARGET_PR_URL: ${{ matrix.url }}
    steps:
      - name: Checkout (for the Dependabot agent and skills)
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install GitHub Copilot CLI
        run: npm install -g @github/copilot

      - name: Verify gh authentication
        run: gh auth status

      - name: Configure git authentication
        run: gh auth setup-git

      - name: Manage Dependabot PR
        run: |
          RESPONSE_DIR="${RUNNER_TEMP}/dependabot-response"
          RESPONSE_FILE="${RESPONSE_DIR}/${{ matrix.slug }}-${TARGET_PR_NUMBER}.md"
          INVALID_RESPONSE_FILE="${RESPONSE_FILE}.invalid"
          RAW_RESPONSE_FILE="./copilot-raw-response.md"
          mkdir -p "$RESPONSE_DIR" copilot-logs
          rm -f "$INVALID_RESPONSE_FILE"

          PROMPT="Manage ${TARGET_PR_URL}.
          workflowRunUrl: ${WORKFLOW_RUN_URL}
          dryRun: ${DRY_RUN}"

          if [ "$DRY_RUN" = "true" ]; then
            github_mcp_args=(--disable-builtin-mcps)
          else
            github_mcp_args=(--enable-all-github-mcp-tools)
            export COPILOT_GITHUB_TOKEN="${COPILOT_GITHUB_TOKEN:-$GH_TOKEN}"
          fi
          if [ -z "$COPILOT_GITHUB_TOKEN" ]; then
            echo "::error::Dry runs require COPILOT_CLI_TOKEN with Copilot entitlement and no cross-repository write scopes."
            copilot_status=1
            : > "$RAW_RESPONSE_FILE"
          else
            set +e
            copilot \
              --allow-all \
              "${github_mcp_args[@]}" \
              --no-ask-user \
              --no-color \
              --output-format json \
              --silent \
              --stream off \
              --agent "Dependabot PR Manager" \
              --log-level debug \
              --log-dir ./copilot-logs \
              --share ./copilot-session.md \
              --prompt "$PROMPT" > "$RAW_RESPONSE_FILE"
            copilot_status=$?
            set -e
          fi

          if ! jq -rs \
            '[.[] | select(.type == "assistant.message" and .data.phase == "final_answer") | .data.content | select(type == "string" and test("\\S"))] | last // ""' \
            "$RAW_RESPONSE_FILE" > "$RESPONSE_FILE"; then
            echo "::warning::The Copilot CLI output was not valid JSON; generating an incomplete result."
            copilot_status=1
          fi

          response_valid=true
          decision="$(head -n 1 "$RESPONSE_FILE" | sed 's/^Decision: //')"
          if ! head -n 1 "$RESPONSE_FILE" | grep -Eq '^Decision: (MERGED|NOT_MERGED|DRY_RUN_NO_ACTION)$'; then
            response_valid=false
          fi
          for field in 'Repository:' 'Pull request:' 'Update:' 'Safety assessment:' 'Final state:' 'Actions taken:' 'Reason:' 'Next action:' 'Workflow run:'; do
            if ! grep -Fq "$field" "$RESPONSE_FILE"; then
              response_valid=false
            fi
          done
          if ! grep -Fq "$TARGET_REPOSITORY" "$RESPONSE_FILE" || ! grep -Fq "$TARGET_PR_URL" "$RESPONSE_FILE"; then
            response_valid=false
          fi
          if [ "$(grep -Fc '<!-- dependabot-pr-manager-result -->' "$RESPONSE_FILE" || true)" -ne 1 ]; then
            response_valid=false
          fi

          live_pr="$(
            gh pr view "$TARGET_PR_NUMBER" \
              --repo "$TARGET_REPOSITORY" \
              --json number,url,author,headRefOid,state,mergedAt \
              2>/dev/null \
              || true
          )"
          if ! jq -e -s \
            --argjson number "$TARGET_PR_NUMBER" \
            --arg url "$TARGET_PR_URL" \
            '
              length == 1 and (.[0] |
                type == "object"
                and .number == $number
                and .url == $url
                and (.author.login == "app/dependabot" or .author.login == "dependabot[bot]")
                and (.headRefOid | type == "string" and test("^[0-9a-fA-F]{40}$"))
              )
            ' <<< "$live_pr" > /dev/null 2>&1; then
            response_valid=false
          fi
          live_head="$(jq -r '.headRefOid // empty' <<< "$live_pr" 2>/dev/null || true)"
          live_merged_at="$(jq -r '.mergedAt // empty' <<< "$live_pr" 2>/dev/null || true)"

          state_line_count="$(
            grep -Ec '^<!-- dependabot-pr-manager-state: \{.*\} -->$' "$RESPONSE_FILE" \
              || true
          )"
          state_line="$(
            grep -E '^<!-- dependabot-pr-manager-state: \{.*\} -->$' "$RESPONSE_FILE" \
              | tail -n 1 \
              || true
          )"
          if [ "$state_line_count" -ne 1 ]; then
            response_valid=false
          else
            state_json="${state_line#<!-- dependabot-pr-manager-state: }"
            state_json="${state_json% -->}"
            if ! jq -e \
              --arg repository "$TARGET_REPOSITORY" \
              --argjson number "$TARGET_PR_NUMBER" \
              --arg head "$live_head" \
              --arg decision "$decision" \
              '
                type == "object"
                and .repository == $repository
                and .number == $number
                and .head == $head
                and .decision == $decision
              ' <<< "$state_json" > /dev/null; then
              response_valid=false
            fi
          fi

          if [ "$DRY_RUN" = "true" ]; then
            if [ "$decision" != "DRY_RUN_NO_ACTION" ]; then
              response_valid=false
            fi
          elif [ "$decision" = "DRY_RUN_NO_ACTION" ]; then
            response_valid=false
          fi
          if [ "$decision" = "MERGED" ] && [ -z "$live_merged_at" ]; then
            response_valid=false
          fi
          if [ "$decision" = "NOT_MERGED" ] && [ -n "$live_merged_at" ]; then
            response_valid=false
          fi

          provenance_line_count="$(
            grep -Ec '^<!-- dependabot-pr-manager-provenance: \{.*\} -->$' "$RESPONSE_FILE" \
              || true
          )"
          provenance_line="$(
            grep -E '^<!-- dependabot-pr-manager-provenance: \{.*\} -->$' "$RESPONSE_FILE" \
              | tail -n 1 \
              || true
          )"
          if [ "$provenance_line_count" -ne 1 ]; then
            response_valid=false
          else
            provenance_json="${provenance_line#<!-- dependabot-pr-manager-provenance: }"
            provenance_json="${provenance_json% -->}"
            if ! jq -e '
              type == "object"
              and (.remediation_heads | type == "array")
              and (.update_branch_merges | type == "array")
              and all(.remediation_heads[]; type == "string" and test("^[0-9a-fA-F]{40}$"))
              and all(.update_branch_merges[];
                type == "object"
                and (.old_head | type == "string" and test("^[0-9a-fA-F]{40}$"))
                and (.audited_base | type == "string" and test("^[0-9a-fA-F]{40}$"))
                and (.applied_base | type == "string" and test("^[0-9a-fA-F]{40}$"))
                and (.merge | type == "string" and test("^[0-9a-fA-F]{40}$"))
                and (.preserved_remediation_heads | type == "array")
                and all(.preserved_remediation_heads[]; type == "string" and test("^[0-9a-fA-F]{40}$"))
              )
            ' <<< "$provenance_json" > /dev/null; then
              response_valid=false
            fi
          fi

          if [ "$response_valid" != "true" ]; then
            touch "$INVALID_RESPONSE_FILE"
            merged_at="$(gh pr view "$TARGET_PR_NUMBER" --repo "$TARGET_REPOSITORY" --json mergedAt --jq '.mergedAt // empty' 2>/dev/null || true)"
            if [ "$DRY_RUN" = "true" ]; then
              decision="DRY_RUN_NO_ACTION"
              reason="The dry-run audit did not produce a valid final response; no management actions were authorized."
              next_action="Inspect the workflow logs and dry-run credentials, then rerun the audit."
            elif [ -n "$merged_at" ]; then
              decision="MERGED"
              reason="The Copilot CLI did not return the required response contract, but GitHub confirms that the PR was merged at ${merged_at}."
              next_action="Inspect the workflow logs to verify the agent's actions."
            else
              decision="NOT_MERGED"
              reason="The Copilot CLI exited with status ${copilot_status} without a valid final response, and the workflow could not verify that the PR merged."
              next_action="Inspect the Copilot session and workflow logs, then manage this PR manually or rerun the workflow."
            fi

            cat > "$RESPONSE_FILE" <<EOF
          Decision: ${decision}
          <!-- dependabot-pr-manager-result -->
          ### Dependabot PR Manager result

          Repository: ${TARGET_REPOSITORY}
          Pull request: [#${TARGET_PR_NUMBER} - ${TARGET_PR_TITLE}](${TARGET_PR_URL})
          Update: Unavailable because the agent did not produce a valid final response.
          Safety assessment: Incomplete.
          Final state: See the PR and workflow logs.
          Actions taken: See the Copilot session log.
          Reason: ${reason}
          Next action: ${next_action}
          Workflow run: ${WORKFLOW_RUN_URL}
          <!-- dependabot-pr-manager-state: {"repository":"${TARGET_REPOSITORY}","number":${TARGET_PR_NUMBER},"head":"${live_head:-0000000000000000000000000000000000000000}","decision":"${decision}"} -->
          <!-- dependabot-pr-manager-provenance: {"remediation_heads":[],"update_branch_merges":[]} -->
          EOF
            copilot_status=1
          fi

          cat "$RESPONSE_FILE"
          exit "$copilot_status"

      - name: Upsert PR management result
        if: ${{ always() && env.DRY_RUN != 'true' }}
        run: |
          set -euo pipefail

          RESPONSE_FILE="${RUNNER_TEMP}/dependabot-response/${{ matrix.slug }}-${TARGET_PR_NUMBER}.md"
          INVALID_RESPONSE_FILE="${RESPONSE_FILE}.invalid"
          if [ ! -s "$RESPONSE_FILE" ]; then
            echo "::error::The manager response file is missing or empty."
            exit 1
          fi

          live_pr="$(
            gh pr view "$TARGET_PR_NUMBER" \
              --repo "$TARGET_REPOSITORY" \
              --json number,url,author,headRefOid,state,mergedAt
          )"
          if ! jq -e -s \
            --argjson number "$TARGET_PR_NUMBER" \
            --arg url "$TARGET_PR_URL" \
            '
              length == 1 and (.[0] |
                type == "object"
                and .number == $number
                and .url == $url
                and (.author.login == "app/dependabot" or .author.login == "dependabot[bot]")
                and (.headRefOid | type == "string" and test("^[0-9a-fA-F]{40}$"))
              )
            ' <<< "$live_pr" > /dev/null; then
            echo "::error::Refusing to comment because the target identity, author, or head could not be validated."
            exit 1
          fi
          live_head="$(jq -r '.headRefOid' <<< "$live_pr")"
          live_merged_at="$(jq -r '.mergedAt // empty' <<< "$live_pr")"

          marker='<!-- dependabot-pr-manager-result -->'
          actor="$(gh api user --jq '.login')"
          comment_id="$(
            gh api --paginate \
              "repos/${TARGET_REPOSITORY}/issues/${TARGET_PR_NUMBER}/comments?per_page=100" \
              --jq ".[] | select(.user.login == \"${actor}\" and (.body | contains(\"${marker}\"))) | .id" \
              | tail -n 1
          )"

          publication_state_error=false
          decision="$(head -n 1 "$RESPONSE_FILE" | sed 's/^Decision: //')"
          state_line_count="$(
            grep -Ec '^<!-- dependabot-pr-manager-state: \{.*\} -->$' "$RESPONSE_FILE" \
              || true
          )"
          state_line="$(
            grep -E '^<!-- dependabot-pr-manager-state: \{.*\} -->$' "$RESPONSE_FILE" \
              | tail -n 1 \
              || true
          )"
          state_valid=true
          if [ "$state_line_count" -ne 1 ]; then
            state_valid=false
          else
            state_json="${state_line#<!-- dependabot-pr-manager-state: }"
            state_json="${state_json% -->}"
            if ! jq -e \
              --arg repository "$TARGET_REPOSITORY" \
              --argjson number "$TARGET_PR_NUMBER" \
              --arg head "$live_head" \
              --arg decision "$decision" \
              '
                .repository == $repository
                and .number == $number
                and .head == $head
                and .decision == $decision
              ' <<< "$state_json" > /dev/null; then
              state_valid=false
            fi
          fi
          if [ "$decision" = "MERGED" ] && [ -z "$live_merged_at" ]; then
            state_valid=false
          fi
          if [ "$decision" = "NOT_MERGED" ] && [ -n "$live_merged_at" ]; then
            state_valid=false
          fi

          if [ "$state_valid" != "true" ]; then
            touch "$INVALID_RESPONSE_FILE"
            publication_state_error=true
            if [ -n "$live_merged_at" ]; then
              decision="MERGED"
              reason="The PR state changed after the agent report; GitHub confirms merge at ${live_merged_at}."
              next_action="Inspect the workflow logs and merged PR."
            else
              decision="NOT_MERGED"
              reason="The agent report no longer matches the live target head or merge state."
              next_action="Inspect the workflow logs and rerun management from fresh PR state."
            fi
            cat > "$RESPONSE_FILE" <<EOF
          Decision: ${decision}
          <!-- dependabot-pr-manager-result -->
          ### Dependabot PR Manager result

          Repository: ${TARGET_REPOSITORY}
          Pull request: [#${TARGET_PR_NUMBER} - ${TARGET_PR_TITLE}](${TARGET_PR_URL})
          Update: Unavailable because the final report was stale.
          Safety assessment: Incomplete.
          Final state: Head ${live_head}; GitHub state refreshed before comment publication.
          Actions taken: The workflow refused to publish the stale agent report.
          Reason: ${reason}
          Next action: ${next_action}
          Workflow run: ${WORKFLOW_RUN_URL}
          <!-- dependabot-pr-manager-state: {"repository":"${TARGET_REPOSITORY}","number":${TARGET_PR_NUMBER},"head":"${live_head}","decision":"${decision}"} -->
          <!-- dependabot-pr-manager-provenance: {"remediation_heads":[],"update_branch_merges":[]} -->
          EOF
            if [ -n "$comment_id" ]; then
              echo "::error::Preserving the existing manager result because the latest report was stale."
              exit 1
            fi
          fi

          if [ -f "$INVALID_RESPONSE_FILE" ] && [ -n "$comment_id" ]; then
            echo "::warning::Preserving the existing manager result and provenance because the latest agent response was invalid."
            exit 0
          fi

          provenance_line="$(
            grep -E '^<!-- dependabot-pr-manager-provenance: \{.*\} -->$' "$RESPONSE_FILE" \
              | tail -n 1
          )"
          provenance_json="${provenance_line#<!-- dependabot-pr-manager-provenance: }"
          provenance_json="${provenance_json% -->}"
          body="$(cat "$RESPONSE_FILE")"

          if [ -n "$comment_id" ]; then
            existing_body="$(
              gh api \
                "repos/${TARGET_REPOSITORY}/issues/comments/${comment_id}" \
                --jq '.body'
            )"
            existing_provenance_count="$(
              printf '%s\n' "$existing_body" \
                | grep -Ec '^<!-- dependabot-pr-manager-provenance: \{.*\} -->$' \
                || true
            )"
            if [ "$existing_provenance_count" -ne 1 ]; then
              echo "::error::Refusing to replace a marked manager result without exactly one provenance ledger."
              exit 1
            fi
            existing_provenance_line="$(
              printf '%s\n' "$existing_body" \
                | grep -E '^<!-- dependabot-pr-manager-provenance: \{.*\} -->$'
            )"
            existing_provenance_json="${existing_provenance_line#<!-- dependabot-pr-manager-provenance: }"
            existing_provenance_json="${existing_provenance_json% -->}"
            if ! jq -e '
              type == "object"
              and (.remediation_heads | type == "array")
              and (.update_branch_merges | type == "array")
              and all(.remediation_heads[]; type == "string" and test("^[0-9a-fA-F]{40}$"))
              and all(.update_branch_merges[];
                type == "object"
                and (.old_head | type == "string" and test("^[0-9a-fA-F]{40}$"))
                and (.audited_base | type == "string" and test("^[0-9a-fA-F]{40}$"))
                and (.applied_base | type == "string" and test("^[0-9a-fA-F]{40}$"))
                and (.merge | type == "string" and test("^[0-9a-fA-F]{40}$"))
                and (.preserved_remediation_heads | type == "array")
                and all(.preserved_remediation_heads[]; type == "string" and test("^[0-9a-fA-F]{40}$"))
              )
            ' <<< "$existing_provenance_json" > /dev/null; then
              echo "::error::Refusing to replace a marked manager result with malformed provenance."
              exit 1
            fi
            if ! jq -n -e \
              --argjson old "$existing_provenance_json" \
              --argjson new "$provenance_json" \
              '
                (($old.remediation_heads - $new.remediation_heads) | length == 0)
                and all($old.update_branch_merges[];
                  . as $entry
                  | ($new.update_branch_merges | index($entry)) != null
                )
              ' > /dev/null; then
              echo "::error::Refusing to replace the manager result because its provenance ledger dropped a prior entry."
              exit 1
            fi
          fi

          write_state_change_report() {
            touch "$INVALID_RESPONSE_FILE"
            publication_state_error=true
            if [ -n "$live_merged_at" ]; then
              decision="MERGED"
              reason="The PR state changed during result publication; GitHub confirms merge at ${live_merged_at}."
              next_action="Inspect the workflow logs and merged PR."
            else
              decision="NOT_MERGED"
              reason="The PR head or merge state changed during result publication."
              next_action="Rerun management from the refreshed PR state."
            fi
            cat > "$RESPONSE_FILE" <<EOF
          Decision: ${decision}
          <!-- dependabot-pr-manager-result -->
          ### Dependabot PR Manager result

          Repository: ${TARGET_REPOSITORY}
          Pull request: [#${TARGET_PR_NUMBER} - ${TARGET_PR_TITLE}](${TARGET_PR_URL})
          Update: Unavailable because the prior final report became stale.
          Safety assessment: Incomplete after concurrent PR state change.
          Final state: Head ${live_head}; GitHub state refreshed during comment publication.
          Actions taken: The workflow replaced the stale report with this live-state fallback.
          Reason: ${reason}
          Next action: ${next_action}
          Workflow run: ${WORKFLOW_RUN_URL}
          <!-- dependabot-pr-manager-state: {"repository":"${TARGET_REPOSITORY}","number":${TARGET_PR_NUMBER},"head":"${live_head}","decision":"${decision}"} -->
          <!-- dependabot-pr-manager-provenance: ${provenance_json} -->
          EOF
            body="$(cat "$RESPONSE_FILE")"
          }

          prepublish_pr="$(
            gh pr view "$TARGET_PR_NUMBER" \
              --repo "$TARGET_REPOSITORY" \
              --json headRefOid,mergedAt
          )"
          prepublish_head="$(jq -r '.headRefOid' <<< "$prepublish_pr")"
          prepublish_merged_at="$(jq -r '.mergedAt // empty' <<< "$prepublish_pr")"
          if [ "$prepublish_head" != "$live_head" ] || [ "$prepublish_merged_at" != "$live_merged_at" ]; then
            live_head="$prepublish_head"
            live_merged_at="$prepublish_merged_at"
            write_state_change_report
          fi

          if [ -n "$comment_id" ]; then
            comment_result="$(
              jq -n --arg body "$body" '{body: $body}' \
                | gh api --method PATCH \
                    "repos/${TARGET_REPOSITORY}/issues/comments/${comment_id}" \
                    --input -
            )"
            echo "Updated PR management result: $(jq -r '.html_url' <<< "$comment_result")"
          else
            comment_result="$(
              jq -n --arg body "$body" '{body: $body}' \
                | gh api --method POST \
                    "repos/${TARGET_REPOSITORY}/issues/${TARGET_PR_NUMBER}/comments" \
                    --input -
            )"
            echo "Created PR management result: $(jq -r '.html_url' <<< "$comment_result")"
          fi
          published_comment_id="$(jq -r '.id' <<< "$comment_result")"

          postpublish_pr="$(
            gh pr view "$TARGET_PR_NUMBER" \
              --repo "$TARGET_REPOSITORY" \
              --json headRefOid,mergedAt
          )"
          postpublish_head="$(jq -r '.headRefOid' <<< "$postpublish_pr")"
          postpublish_merged_at="$(jq -r '.mergedAt // empty' <<< "$postpublish_pr")"
          if [ "$postpublish_head" != "$live_head" ] || [ "$postpublish_merged_at" != "$live_merged_at" ]; then
            live_head="$postpublish_head"
            live_merged_at="$postpublish_merged_at"
            write_state_change_report
            jq -n --arg body "$body" '{body: $body}' \
              | gh api --method PATCH \
                  "repos/${TARGET_REPOSITORY}/issues/comments/${published_comment_id}" \
                  --input - \
                  --silent
            echo "::error::PR state changed during publication; the result comment was corrected to a live-state fallback."

            verification_pr="$(
              gh pr view "$TARGET_PR_NUMBER" \
                --repo "$TARGET_REPOSITORY" \
                --json headRefOid,mergedAt
            )"
            verification_head="$(jq -r '.headRefOid' <<< "$verification_pr")"
            verification_merged_at="$(jq -r '.mergedAt // empty' <<< "$verification_pr")"
            if [ "$verification_head" != "$live_head" ] || [ "$verification_merged_at" != "$live_merged_at" ]; then
              live_head="$verification_head"
              live_merged_at="$verification_merged_at"
              write_state_change_report
              jq -n --arg body "$body" '{body: $body}' \
                | gh api --method PATCH \
                    "repos/${TARGET_REPOSITORY}/issues/comments/${published_comment_id}" \
                    --input - \
                    --silent
              echo "::error::PR state changed again during correction; the result comment was updated to the latest observed state."
            fi
          fi

          if [ "$publication_state_error" = "true" ]; then
            exit 1
          fi

      - name: Upload final response
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: dependabot-response-${{ matrix.slug }}-${{ matrix.number }}
          path: ${{ runner.temp }}/dependabot-response/${{ matrix.slug }}-${{ matrix.number }}.md
          if-no-files-found: error
          retention-days: 1

      - name: Upload Copilot logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: copilot-logs-${{ matrix.slug }}-${{ matrix.number }}
          path: |
            ./copilot-raw-response.md
            ./copilot-session.md
          if-no-files-found: ignore
          retention-days: 14

  notify:
    name: Send aggregated Teams notification
    needs:
      - build-pull-request-matrix
      - manage-dependabot
    if: ${{ always() && needs.build-pull-request-matrix.outputs.count != '0' }}
    runs-on: ubuntu-latest
    env:
      EXPECTED_MATRIX: ${{ needs.build-pull-request-matrix.outputs.matrix }}
      COPILOT_GITHUB_TOKEN: ${{ secrets.GH_PAT }}
      PERSONAL_NOTIFICATION_URL: ${{ secrets.PERSONAL_NOTIFICATION_URL }}
      RECIPIENTS: ${{ secrets.RECIPIENTS }}
      WORKFLOW_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Checkout (for the notification skill)
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install GitHub Copilot CLI
        run: npm install -g @github/copilot

      - name: Download final responses
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: dependabot-response-*
          path: responses
          merge-multiple: true

      - name: Aggregate final responses
        id: aggregate
        shell: bash
        run: |
          mkdir -p responses
          expected_count="$(jq '.include | length' <<< "$EXPECTED_MATRIX")"

          while IFS= read -r pull_request; do
            repository="$(jq -r '.repository' <<< "$pull_request")"
            slug="$(jq -r '.slug' <<< "$pull_request")"
            number="$(jq -r '.number' <<< "$pull_request")"
            title="$(jq -r '.title' <<< "$pull_request")"
            url="$(jq -r '.url' <<< "$pull_request")"
            response_file="responses/${slug}-${number}.md"

            if [ ! -s "$response_file" ]; then
              cat > "$response_file" <<EOF
          Decision: NOT_MERGED
          Repository: ${repository}
          Pull request: [#${number} - ${title}](${url})
          Update: Unavailable because no final response artifact was produced.
          Safety assessment: Incomplete.
          Final state: Unknown.
          Actions taken: The PR worker did not produce a final response.
          Reason: The matrix job failed or stopped before its final response could be uploaded.
          Next action: Inspect this workflow run and manage the PR manually or rerun the workflow.
          Workflow run: ${WORKFLOW_RUN_URL}
          EOF
            fi
          done < <(jq -c '.include[]' <<< "$EXPECTED_MATRIX")

          mapfile -t response_files < <(find responses -maxdepth 1 -type f -name '*.md' -print | sort)
          not_merged=0
          merged=0
          dry_run=0

          for response_file in "${response_files[@]}"; do
            case "$(head -n 1 "$response_file")" in
              "Decision: MERGED")
                merged=$((merged + 1))
                ;;
              "Decision: NOT_MERGED")
                not_merged=$((not_merged + 1))
                ;;
              "Decision: DRY_RUN_NO_ACTION")
                dry_run=$((dry_run + 1))
                ;;
              *)
                original_response="$(cat "$response_file")"
                cat > "$response_file" <<EOF
          Decision: NOT_MERGED
          Repository: Unknown
          Pull request: Unknown
          Update: Unavailable because the final response was malformed.
          Safety assessment: Incomplete.
          Final state: Unknown.
          Actions taken: A response artifact was produced but did not satisfy the agent contract.
          Reason: The first line did not contain a recognized decision.
          Next action: Inspect the raw response below and the workflow logs.
          Workflow run: ${WORKFLOW_RUN_URL}

          Raw response:

          ${original_response}
          EOF
                not_merged=$((not_merged + 1))
                ;;
            esac
          done

          SUMMARY_FILE="${RUNNER_TEMP}/dependabot-summary.md"
          {
            echo "# Dependabot auto-merge report"
            echo
            echo "- PRs discovered: ${expected_count}"
            echo "- Merged: ${merged}"
            echo "- Not merged: ${not_merged}"
            echo "- Dry-run audits: ${dry_run}"
            echo

            for response_file in "${response_files[@]}"; do
              echo "---"
              echo
              cat "$response_file"
              echo
            done
          } > "$SUMMARY_FILE"

          cat "$SUMMARY_FILE" >> "$GITHUB_STEP_SUMMARY"
          echo "not_merged=${not_merged}" >> "$GITHUB_OUTPUT"

      - name: Send aggregated Teams notification
        if: ${{ steps.aggregate.outputs.not_merged != '0' }}
        shell: bash
        run: |
          if [ -z "$PERSONAL_NOTIFICATION_URL" ]; then
            echo "::error::PERSONAL_NOTIFICATION_URL is required when one or more PRs are not merged."
            exit 1
          fi
          if [ -z "$RECIPIENTS" ]; then
            echo "::error::RECIPIENTS is required when one or more PRs are not merged."
            exit 1
          fi

          PROMPT="Use the send-teams-notification skill at .github/skills/send-teams-notification/SKILL.md.

          Read ${RUNNER_TEMP}/dependabot-summary.md as source evidence for this workflow run. Compose a concise, readable Markdown report that:
          - summarizes the overall merged, not-merged, and dry-run counts;
          - prioritizes every NOT_MERGED pull request;
          - states each concrete no-merge reason and required next action;
          - keeps repository, PR, dependency transition, CI, and recovery details needed for recipients to act;
          - distinguishes successful, failed, skipped, and unnecessary branch recovery from the remaining no-merge blocker, and never describes a successfully rebased PR as still behind;
          - includes ${WORKFLOW_RUN_URL}.

          Split the RECIPIENTS environment variable on commas or semicolons and trim whitespace. Send the same aggregated report exactly once to each non-empty recipient through the skill, using PERSONAL_NOTIFICATION_URL and WORKFLOW_RUN_URL. Do not send to any other address. Never retry a notification unless a definite non-2xx response or connection failure confirms it was not delivered; do not retry an ambiguous result.

          Use a title like 'Dependabot auto-merge - ${{ steps.aggregate.outputs.not_merged }} PR(s) not merged'. After all attempts, include the exact title and Markdown report sent, then list each recipient and its confirmed HTTP status or exact failure. Do not manage pull requests or modify repository files."

          mkdir -p copilot-notification-logs
          copilot \
            --allow-all \
            --no-ask-user \
            --no-color \
            --silent \
            --stream off \
            --log-level debug \
            --log-dir ./copilot-notification-logs \
            --share ./copilot-notification-session.md \
            --prompt "$PROMPT" | tee ./copilot-notification-result.md

      - name: Upload notification session
        if: ${{ always() && steps.aggregate.outputs.not_merged != '0' }}
        uses: actions/upload-artifact@v4
        with:
          name: copilot-notification-session
          path: |
            ./copilot-notification-result.md
            ./copilot-notification-session.md
          if-no-files-found: ignore
          retention-days: 14
